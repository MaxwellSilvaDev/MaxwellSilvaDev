<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190">
  <rect width="720" height="190" fill="none"/>

  <g font-family="Arial, Helvetica, sans-serif"
     font-size="18"
     font-weight="600"
     text-anchor="middle"
     fill="#E6EDF3">

    <g transform="translate(120,0)">
      <image
        href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg"
        x="-45"
        y="10"
        width="90"
        height="90"/>
      <text x="0" y="135">MySQL</text>
    </g>

    <g transform="translate(360,0)">
      <image
        href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg"
        x="-45"
        y="10"
        width="90"
        height="90"/>
      <text x="0" y="135">PostgreSQL</text>
    </g>

    <g transform="translate(600,0)">
      <image
        href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/docker/docker-original.svg"
        x="-45"
        y="10"
        width="90"
        height="90"/>
      <text x="0" y="135">Docker</text>
    </g>

  </g>
</svg>
