<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <circle cx="210" cy="210" r="145"/>
    </clipPath>
  </defs>

  <circle cx="210" cy="210" r="165" fill="#050B18"/>

  <image
    href="../foto-perfil.jpg"
    x="65"
    y="65"
    width="290"
    height="290"
    clip-path="url(#clip)"
    preserveAspectRatio="xMidYMid slice"/>

  <circle
    cx="210"
    cy="210"
    r="150"
    fill="none"
    stroke="#7C3AED"
    stroke-width="5"
    filter="url(#glow)"/>

  <circle
    cx="210"
    cy="210"
    r="160"
    fill="none"
    stroke="#2563EB"
    stroke-opacity="0.35"
    stroke-width="2"/>
</svg>
