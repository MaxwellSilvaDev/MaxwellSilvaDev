name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MaxwellSilvaDev
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C9D1D9&color_dots=#161B22,#30363D,#484F58,#6E7681,#8B949E
            dist/github-contribution-grid-snake-dark.svg?color_snake=#C9D1D9&color_dots=#161B22,#30363D,#484F58,#6E7681,#8B949E

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}